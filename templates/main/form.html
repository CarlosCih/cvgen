{% extends "base.html" %} {% block title %} Formulario &middot; CV Manager {% endblock %} {% block content %}
<div class="max-w-3xl mx-auto px-6 py-12">
  <div
    class="bg-white/70 backdrop-blur-xl rounded-2xl shadow-soft ring-1 ring-slate-200 p-6 md:p-8"
  >
    <h2 class="text-2xl font-bold mb-6">Crear Nuevo CV</h2>
    <form action="" method="post" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700"
          >Nombre Completo</label
        >
        <input
          type="text"
          name="name"
          id="name"
          required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-brand-500 focus:border-brand-500 sm:text-sm"
        />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700"
          >Correo Electrónico</label
        >
        <input
          type="email"
          name="email"
          id="email"
          required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-brand-500 focus:border-brand-500 sm:text-sm"
        />
      </div>
      <div>
        <label for="summary" class="block text-sm font-medium text-gray-700"
          >Resumen Profesional</label
        >
        <textarea
          name="summary"
          id="summary"
          rows="4"
          required
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-brand-500 focus:border-brand-500 sm:text-sm"
        ></textarea>
      </div>
    </form>
  </div>
</div>
{% endblock %}
